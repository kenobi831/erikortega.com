<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog · Erik Ortega</title>
<meta name="description" content="Erik Ortega's blog: memoirs, mornings, and the story behind all of it.">
<meta name="theme-color" content="#0c1118">
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/assets/portfolio.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/navigation.js" defer></script>
<style>
  .diary { max-width: 680px; }
  .entry { margin-top: 28px; padding: 26px 24px; }
  .entry .meta { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin: 0 0 8px; }
  .entry h2 { font-size: 24px; font-weight: 760; letter-spacing: -.03em; line-height: 1.2; margin: 0 0 18px; }
  .entry p { font-family: Georgia, "Times New Roman", serif; font-size: 18px; line-height: 1.7; color: #d4dde5; margin: 0 0 16px; }
  .entry p:last-child { margin-bottom: 0; }
  .entry .photo { margin: 0 0 22px; }
  .entry .photo img { display: block; width: auto; max-width: 100%; max-height: 720px; margin: 0 auto; border-radius: 12px; border: 1px solid var(--line); }
  .blog-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .langtoggle { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; padding: 3px; background: var(--well); }
  .langtoggle button { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12px; font-weight: 750; letter-spacing: .08em; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .langtoggle button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .langtoggle button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .entry .permalink { color: inherit; text-decoration: none; }
  .entry .permalink:hover { text-decoration: underline; }
  .entry.private { border-color: var(--line-2); }
  .entry .lock { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: var(--well); border: 1px solid var(--line-2); font-size: 11px; letter-spacing: .08em; }
  .owner-bar { margin-top: 28px; font-size: 13px; color: var(--muted); }
  .owner-bar button, .owner-bar input { font: inherit; font-size: 13px; }
  .owner-bar button { appearance: none; background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; }
  .owner-bar form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .owner-bar input { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--well); color: inherit; min-width: 0; flex: 1 1 200px; }
  .owner-bar form button { border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 12px; text-decoration: none; }
  @media (max-width: 520px) { .entry { padding: 20px 16px; } .entry p { font-size: 17px; } }
</style>
</head>
<body>
<a class="skip" href="#main-content">Skip to content</a><header class="portfolio-header"><a class="wordmark" href="/" aria-label="Erik Ortega home">ERIK<br>ORTEGA<span>®</span></a><button class="menu-toggle" aria-expanded="false" aria-controls="main-nav">Menu <span>+</span></button><nav id="main-nav" aria-label="Main navigation"><a href="/">Home</a><a href="/#projects">Projects</a><a href="/brief.html">Trading Journal</a><a href="/blog.html" aria-current="page">Blog</a><a href="/#about">About</a><a class="hello" href="mailto:erik@erikortega.com">Say hello ↗</a></nav></header>
<main id="main-content" class="wrap diary">
  <div class="blog-head">
    <div class="eyebrow">Blog</div>
    <div class="langtoggle" role="group" aria-label="Language / Idioma">
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
    </div>
  </div>
  <h1 class="title" data-i18n="title">Family memoirs</h1>
  <p class="sub" data-i18n="sub">Memoirs, family pictures, and the story behind all of it.</p>
  <div id="entries" aria-live="polite"><p class="small muted mt4">Loading…</p></div>
  <div class="owner-bar" id="ownerBar"></div>
  <footer>© Erik Ortega · Salinas, CA</footer>
</main>
<script>
(async () => {
  const box = $("#entries");
  const UI = {
    es: { title: "Memorias de familia", sub: "Memorias, fotos de familia y la historia detrás de todo.", empty: "La primera entrada viene pronto.", error: "El blog no cargó. Intenta de nuevo en un momento.", priv: "Privada", signin: "Entrar", signout: "Salir", send: "Enviar link", sent: "Revisa tu correo para el link.", owner: "Viendo entradas privadas." },
    en: { title: "Family memoirs", sub: "Memoirs, family pictures, and the story behind all of it.", empty: "First entry coming soon.", error: "The blog didn't load. Refresh in a moment.", priv: "Private", signin: "Sign in", signout: "Sign out", send: "Send link", sent: "Check your email for the link.", owner: "Showing private entries." },
  };
  const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  const fecha = (iso, L) => { const p = dateParts(iso); return L === "es" ? `${DIAS[p.wd]} ${p.d} de ${MESES[p.m - 1]}, ${p.y}` : longDate(iso); };

  const param = new URLSearchParams(location.search).get("lang");
  let saved = null; try { saved = localStorage.getItem("blog-lang"); } catch {}
  let L = ["es", "en"].includes(param) ? param : ["es", "en"].includes(saved) ? saved : "en";

  // Private entries live in Supabase (blog_private), readable only by the owner when signed in.
  const OWNER = "erik@erikortega.com";
  const sb = window.supabase ? supabase.createClient("https://dthvmmjzlazsgybgzmtb.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0aHZtbWp6bGF6c2d5Ymd6bXRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4MDczNzEsImV4cCI6MjEwODM4MzM3MX0.D8rke2iwHSISgMAr0pqAJ2qX2Ra9HygS-X0RiJHvywY") : null;
  let session = null, priv = [], sent = false, showForm = false;
  if (sb) {
    try { session = (await sb.auth.getSession()).data.session; } catch {}
    if (session && session.user && session.user.email === OWNER) {
      try { const r = await sb.from("blog_private").select("*"); priv = (r.data || []).map((e) => Object.assign({}, e, { private: true })); } catch {}
    }
  }

  let data = null, failed = false;
  try { data = await getJSON("/data/diary/index.json"); } catch { failed = !priv.length; }
  const entries = ((data && data.entries) || []).concat(priv).filter((e) => e && e.date).sort((a, b) => b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id)));
  // An entry's top-level fields are in its own language; e.en / e.es hold the translation.
  const view = (e) => (L === (e.lang || "en") || !e[L] ? e : Object.assign({}, e, e[L], { lang: L }));

  const render = () => {
    document.documentElement.lang = L;
    document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = UI[L][el.dataset.i18n]));
    document.querySelectorAll(".langtoggle button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === L)));
    renderOwner();
    if (failed) { box.innerHTML = `<div class="card" style="margin-top:24px"><p class="prose">${UI[L].error}</p></div>`; return; }
    if (!entries.length) { box.innerHTML = `<div class="card" style="margin-top:24px"><p class="prose">${UI[L].empty}</p></div>`; return; }
    box.innerHTML = entries.map(view).map((e) => `
    <article class="card entry${e.private ? " private" : ""}" id="${esc(e.id)}" lang="${esc(e.lang || "en")}">
      <p class="meta"><a class="permalink" href="#${esc(e.id)}">${esc(fecha(e.date, L))}${e.moment ? " · " + esc(e.moment) : ""}</a>${e.private ? `<span class="lock">🔒 ${UI[L].priv}</span>` : ""}</p>
      ${e.title ? `<h2>${esc(e.title)}</h2>` : ""}
      ${e.photo && e.photo.src ? `<figure class="photo"><img src="${esc(e.photo.src)}" alt="${esc(e.alt || "")}" loading="lazy"></figure>` : ""}
      ${(e.paragraphs || []).map((t) => `<p>${esc(t)}</p>`).join("")}
    </article>`).join("");
  };

  function renderOwner() {
    const bar = $("#ownerBar");
    if (!sb) { bar.innerHTML = ""; return; }
    if (session) {
      bar.innerHTML = `${session.user.email === OWNER ? UI[L].owner + " " : ""}<button type="button" id="signOut">${UI[L].signout}</button>`;
      $("#signOut").onclick = async () => { await sb.auth.signOut(); location.reload(); };
    } else if (sent) {
      bar.textContent = UI[L].sent;
    } else if (showForm) {
      bar.innerHTML = `<form id="signForm"><input type="email" required autocomplete="email" placeholder="email" aria-label="Email"><button type="submit">${UI[L].send}</button></form>`;
      $("#signForm").onsubmit = async (ev) => {
        ev.preventDefault();
        const email = ev.target.querySelector("input").value.trim();
        const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + "/blog.html", shouldCreateUser: false } });
        if (error) { alert(error.message); return; }
        sent = true; renderOwner();
      };
    } else {
      bar.innerHTML = `<button type="button" id="signIn">🔒 ${UI[L].signin}</button>`;
      $("#signIn").onclick = () => { showForm = true; renderOwner(); };
    }
  }

  document.querySelectorAll(".langtoggle button").forEach((b) => b.addEventListener("click", () => {
    if (b.dataset.lang === L) return;
    L = b.dataset.lang;
    try { localStorage.setItem("blog-lang", L); } catch {}
    render();
  }));
  render();
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
})();
</script>
</body>
</html>
